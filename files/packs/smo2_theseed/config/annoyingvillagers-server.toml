#Chance for Herobrine possess another player npc into Herobrine #5 and Herobrine #6
#Range: 0.0 ~ 1.0
herobrinePossessRate = 0.5
#The minimum value (in minutes) for Herobrine's random recall time. This value should be lower than or equal the maximum. After a random time between min and max, Herobrine will vanish and return to the Herobrine dimension.
#Range: 1 ~ 10080
herobrineRecallMinTime = 60
#The maximum value (in minutes) for Herobrine's random recall time. This value should be greater than or equal to the minimum. After a random time between min and max, Herobrine will vanish and return to the Herobrine dimension.
#Range: 1 ~ 10080
herobrineRecallMaxTime = 300
#Chance for Steve to be Angry after getting killed
#Range: 0.0 ~ 1.0
angrySteveChance = 0.2
#The minimum value (in minutes) for Angry Steve's random leave time. This value should be lower than or equal the maximum. After a random time between min and max, Angry Steve will feel exhausted and leave the game.
#Range: 1 ~ 10080
angrySteveLeaveMinTime = 60
#The maximum value (in minutes) for Angry Steve's random leave time. This value should be greater than or equal to the minimum. After a random time between min and max, Angry Steve will feel exhausted and leave the game.
#Range: 1 ~ 10080
angrySteveLeaveMaxTime = 300
#Mob's stamina will be decreased by this percentage when get hit by Kick
#Range: 0.0 ~ 1.0
kickStaminaDecreasePercentage = 0.3
#Min chance for mob can wake up automatically on guard break
#Range: 0.0 ~ 1.0
mobGuardBreakWakeUpMinChance = 0.05
#Max chance for mob can wake up automatically on guard break
#Range: 0.0 ~ 1.0
mobGuardBreakWakeUpMaxChance = 0.4
#Turn on all chatting for NPC
turnOnNpcChat = true
#Make arrow can break block
arrowCanBreakBlock = true
#Make all of AV NPCs and Mobs can be executed
canExecuteAvMob = true
#Enable execute ability for all of Av NPCs and Mobs
AvMobCanExecute = true
#Enable burning items ability for all of Av NPCs and Mobs
AvMobCanBurnItem = true
#Enable drinking healing potion ability for Zombie and Skeleton
VanillaMobCanDrinkHealingPotion = true
#The value of durability lose of a weapon when Av Bosses blocking or clashing a dangerous animation or when Player clashing a dangerous animation by Av Bosses
#Range: 0 ~ 10000
weaponBreakingMechanismValue = 10

#==== NPC Behaviour ====
[npcBehaviour]
	#Weight for Player NPC to target and attack all monsters in the world
	#Range: 0.0 ~ 10.0
	npcTargetWeightMonsterHunter = 1.0
	#Weight for Player NPC to target and attack all villagers in the world
	#Range: 0.0 ~ 10.0
	npcTargetWeightVillagerHunter = 1.0
	#Weight for Player NPC to target and attack players and other Player NPCs
	#Range: 0.0 ~ 10.0
	npcTargetWeightPlayerHunter = 1.0
	#Weight for Player NPC to target and attack everything in the world
	#Range: 0.0 ~ 10.0
	npcTargetWeightHostileHunter = 1.0
	#Weight for Player NPC to run away from everything in the world
	#Range: 0.0 ~ 10.0
	npcTargetWeightPassiveHunter = 1.0
	#Weight for Player NPC to target and attack all animals in the world
	#Range: 0.0 ~ 10.0
	npcTargetWeightAnimalHunter = 1.0

