		defaultOffHandOffsets = "0,0,0,0"
		separateOffHandOffsets = "-2,-3,0,0"
		selectedItemNameOffsets = "2,0,0,0"

	[properties.Global_Buff_Settings]
		#Scale factor for buff icons.
		#Range: 0.1 ~ 5.0
		buffFrameScaleFactor = 0.5
		#Vertical offset of buff bar from the bottom center HUD.
		#Range: -100 ~ 100
		buffBarVerticalOffset = 2
		#Horizontal gap between buff icons.
		#Range: 0 ~ 50
		buffIconHorizontalGap = 2
		#Vertical gap between rows of buff icons.
		#Range: 0 ~ 50
		buffRowVerticalGap = 2

	[properties.Global_Toggles]
		#Allow Ares HUD to override Iron's Spells/Covenant of the Seven Mana/LP bars.
		#Set to false if you want to use the original mod's UI.
		overrideSpellBars = true
		#Replace the food/hunger bar with the mana bar.
		#Functions similarly to the TcrCore/DuelCraft integration. Suitable for magic-heavy modpacks.
		replaceFoodWithMana = false

