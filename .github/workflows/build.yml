name: Build Release

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Test Toketmon live patch
        run: npm run test:toketmon

      - name: Lint changed runtime files
        run: npx eslint app/assets/js/toketmonpackmanager.js tools/test-toketmon-live-patch.js

      - name: Build Windows installer
        if: github.event_name == 'pull_request'
        run: npm run dist:win -- --publish never

      - name: Build and publish Windows installer
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win -- --publish always
